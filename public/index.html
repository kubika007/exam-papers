<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>试卷库 · 每学期各科试卷</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">📚</span>
      <div class="brand-text">
        <h1>试卷库</h1>
        <p class="sub">按「科目 → 学期 → 试卷」整理每一次考试的试卷</p>
      </div>
    </div>
    <button id="adminBtn" class="admin-btn" type="button">管理 / 上传</button>
  </header>

  <main class="container">
    <section class="section-title">
      <h2>选择科目</h2>
      <span class="hint" id="countHint"></span>
    </section>

    <div class="filterbar" id="gradeFilter">
      <span class="filter-label">年级</span>
      <button class="chip active" data-grade="">全部</button>
      <button class="chip" data-grade="七年级">七年级</button>
      <button class="chip" data-grade="八年级">八年级</button>
      <button class="chip" data-grade="九年级">九年级</button>
      <button class="chip" data-grade="__none__">未标年级</button>
      <span class="filter-tip" id="filterTip"></span>
    </div>

    <section id="subjects" class="grid"></section>
  </main>

  <!-- 浏览弹窗：科目 → 学期 → 试卷 -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head">
        <nav id="crumb" class="crumb"></nav>
        <button id="closeModal" class="icon-btn" type="button" aria-label="关闭">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <!-- 管理员面板 -->
  <aside id="adminPanel" class="admin-panel hidden">
    <div class="admin-head">
      <h3>管理 / 上传试卷</h3>
      <button id="closeAdmin" class="icon-btn" type="button" aria-label="关闭">✕</button>
    </div>

    <div class="admin-section">
      <label class="field-label">管理员口令</label>
      <div class="token-row">
        <input id="tokenInput" class="text-input" type="password" placeholder="输入部署时设置的 ADMIN_TOKEN" />
        <button id="saveToken" class="btn small" type="button">保存</button>
      </div>
      <p class="token-status" id="tokenStatus"></p>
    </div>

    <div class="admin-section">
      <label class="field-label">选择文件（支持压缩包）</label>
      <input id="upFiles" class="file-input" type="file" multiple
             accept=".zip,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png" />
      <p class="hint">
        可直接拖入 <b>.zip 压缩包</b>：会自动解压，并按「文件夹名 / 文件名」识别<b>年级 · 科目 · 学期 · 月份</b>，
        识别结果在下方清单里可逐条修改。<br />
        单份不超过 25MB。
      </p>
    </div>

    <div class="admin-section">
      <label class="field-label">统一归类（可选）</label>
      <div class="bulk-row">
        <select id="bulkGrade" class="text-input small">
          <option value="">年级：自动识别</option>
          <option value="七年级">七年级</option>
          <option value="八年级">八年级</option>
          <option value="九年级">九年级</option>
        </select>
        <select id="bulkSemester" class="text-input small">
          <option value="">学期：自动识别</option>
        </select>
        <select id="bulkMonth" class="text-input small">
          <option value="">月份：自动识别</option>
        </select>
      </div>
      <p class="hint">选了就覆盖全部文件的年级 / 学期 / 月份；留空则按文件名自动识别（文件名含「10月」会自动选中）。</p>
    </div>

    <div id="reviewBox" class="review-box hidden">
      <div class="review-head">
        <span id="reviewCount"></span>
        <button id="clearPending" class="btn ghost small" type="button">清空清单</button>
      </div>
      <div id="reviewList" class="review-list"></div>
    </div>

    <button id="uploadBtn" class="btn primary" type="button">上传</button>
    <div id="uploadLog" class="upload-log"></div>
  </aside>

  <div id="toast" class="toast hidden"></div>

  <script src="/zipper.js"></script>
  <script src="/app.js"></script>
</body>
</html>
