name = "exam-papers"
compatibility_date = "2026-10-13"

# ⚠️ 本项目是 Cloudflare Pages（静态托管 public/ + 根目录 functions/ 作为后端）
# 构建请在控制台配置：框架预设「无」、构建命令留空、构建输出目录 public
# 千万不要用 `wrangler deploy`（那是 Workers 的命令，在 Pages 上会报
# "Missing entry-point to Worker script or to assets directory"）
pages_build_output_dir = "public"

# 试卷存放在 Workers KV（免费层无需绑定信用卡，区别于 R2 必须绑卡）
# ⚠️ KV 绑定必须写在这里：Pages 每次构建都会读本文件，
#    通过 API/控制台设的绑定会被本文件覆盖掉（教训：只在控制台设会失效）。
[[kv_namespaces]]
binding = "PAPERS"
id = "01cf511cd9274a87bf8931da31ff838e"

# 管理员口令 ADMIN_TOKEN 是密钥，不能写进文件（仓库是公开的），
# 只能在控制台「设置 → 环境变量」或经 API 设置；密钥不会被本文件覆盖。
